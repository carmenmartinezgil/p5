<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Concrete Poetry Spiral</title>
<style>
  :root{
    --background: #050505;
    --text-color: #f3e96b;
    --font: "Helvetica Neue", Arial, sans-serif;

    /* spiral controls */
    --angle-step: 20deg;
    --radius-step: 14px;
    --expand-duration: 1.6s;
    --delay-step: 0.07s;
  }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--background);
    font-family: var(--font);
    color: var(--text-color);
  }

  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  .spiral {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 0;
    height: 0;
  }

  .word {
    position: absolute;
    left: 0;
    top: 0;
    display: block;
    white-space: nowrap;
    font-size: 18px;
    letter-spacing: 1px;
    color: var(--text-color);
    opacity: 0;
    transform-origin: center;
    cursor: default;
    user-select: none;
    transition: transform 0.25s ease, font-size 0.25s, color 0.15s, text-shadow 0.15s;
  }

  .word {
    --angle: calc(var(--i) * var(--angle-step));
    --radius: calc(var(--i) * var(--radius-step));
    transform: rotate(var(--angle)) translateY(0) rotate(calc(-1 * var(--angle)));
    animation: expand var(--expand-duration) cubic-bezier(.08,.8,.2,1) forwards;
    animation-delay: calc(var(--i) * var(--delay-step));
  }

  @keyframes expand {
    from {
      opacity: 0;
      transform: rotate(var(--angle)) translateY(0) rotate(calc(-1 * var(--angle)));
    }
    60% {
      opacity: 1;
    }
    to {
      opacity: 1;
      transform: rotate(var(--angle)) translateY(var(--radius)) rotate(calc(-1 * var(--angle)));
    }
  }

  .word:hover {
    z-index: 1000;
    color: #ffffff;
    text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    transform: rotate(var(--angle)) translateY(var(--radius)) rotate(calc(-1 * var(--angle))) scale(1.8);
    font-size: 22px;
  }

  @media (max-width: 600px) {
    .word { font-size: 14px; --radius-step: 10px; }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="spiral">
      <!--Poema-->
      <span class="word" style="--i:1">I</span>
      <span class="word" style="--i:2">ego</span>
      <span class="word" style="--i:3">eu</span>
      <span class="word" style="--i:4">R</span>
      <span class="word" style="--i:5">ich</span>
      <span class="word" style="--i:6">io</span>
      <span class="word" style="--i:7">yo</span>
      <span class="word" style="--i:8">sos</span>
      <span class="word" style="--i:9">pos</span>
      <span class="word" style="--i:10">nos</span>
      <span class="word" style="--i:11">que</span>
      <span class="word" style="--i:12">faremos</span>
      <span class="word" style="--i:13">apos</span>
      <span class="word" style="--i:14">?</span>
      <span class="word" style="--i:15">sem</span>
      <span class="word" style="--i:16">sol</span>
      <span class="word" style="--i:17">na noite</span>
      <span class="word" style="--i:18">vagaremos</span>
      <span class="word" style="--i:19">que</span>
      <span class="word" style="--i:20">sem</span>
      <span class="word" style="--i:22">amor</span>
    <span class="word" style="--i:23">sem</span>
    <span class="word" style="--i:24">mae</span>
    <span class="word" style="--i:25">pai</span>
    <span class="word" style="--i:26">sos</span>
    </div>
  </div>
</body>
</html>
